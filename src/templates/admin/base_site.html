{% extends "admin/base.html" %}
{% load i18n %}

{% block title %}{{ title }} | Crossword Admin{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}">
        Crossword Admin
    </a>
</h1>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    /* ── Base ───────────────────────────────────────── */
    *,
    *::before,
    *::after {
        box-sizing: border-box;
    }

    body,
    html {
        font-family: 'Inter', sans-serif !important;
        background: #0f1117 !important;
        color: #e2e8f0 !important;
    }

    /* ── Top Header ─────────────────────────────────── */
    #header {
        background: linear-gradient(135deg, #0d4f5c 0%, #1a7a8c 50%, #0d6375 100%) !important;
        padding: 0 24px !important;
        height: 60px !important;
        display: flex !important;
        align-items: center !important;
        box-shadow: 0 2px 20px rgba(0, 200, 200, 0.15) !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
    }

    #header a:link,
    #header a:visited {
        color: #ffffff !important;
        text-decoration: none !important;
    }

    #site-name a {
        font-size: 1.4rem !important;
        font-weight: 700 !important;
        color: #fff !important;
        letter-spacing: 0.5px !important;
    }

    #user-tools {
        font-size: 0.82rem !important;
        color: rgba(255, 255, 255, 0.85) !important;
    }

    #user-tools a {
        color: #7dd3e8 !important;
        border-bottom: 1px solid transparent !important;
        transition: color 0.2s !important;
    }

    #user-tools a:hover {
        color: #fff !important;
        border-bottom-color: #7dd3e8 !important;
    }

    /* ── Breadcrumbs ────────────────────────────────── */
    div.breadcrumbs {
        background: #161b27 !important;
        padding: 10px 24px !important;
        font-size: 0.82rem !important;
        border-bottom: 1px solid #1e2533 !important;
        color: #94a3b8 !important;
    }

    div.breadcrumbs a {
        color: #38bdf8 !important;
    }

    div.breadcrumbs a:hover {
        color: #7dd3e8 !important;
    }

    /* ── Content Area ───────────────────────────────── */
    #content-main,
    #content {
        background: transparent !important;
    }

    #content-main h1,
    #content h1 {
        color: #e2e8f0 !important;
        font-size: 1.5rem !important;
        font-weight: 600 !important;
        margin-bottom: 1.2rem !important;
    }

    /* ── Sidebar / Nav ──────────────────────────────── */
    #nav-sidebar,
    .toggle-nav-sidebar {
        background: #111827 !important;
        border-right: 1px solid #1e2533 !important;
    }

    .module>h2,
    .module>caption,
    #nav-sidebar .module>h2 {
        background: linear-gradient(90deg, #0d4f5c, #1a7a8c) !important;
        color: #fff !important;
        padding: 10px 16px !important;
        font-size: 0.78rem !important;
        font-weight: 700 !important;
        letter-spacing: 1px !important;
        text-transform: uppercase !important;
        border-radius: 6px 6px 0 0 !important;
    }

    /* ── App Index Cards ────────────────────────────── */
    .app-crossword-myapp .module,
    .app-crossword-accounts .module,
    .module {
        background: #1a1f2e !important;
        border: 1px solid #1e2533 !important;
        border-radius: 10px !important;
        overflow: hidden !important;
        margin-bottom: 1.5rem !important;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3) !important;
    }

    .module table {
        width: 100% !important;
    }

    .module table th {
        color: #94a3b8 !important;
        font-weight: 600 !important;
        background: #111827 !important;
        padding: 10px 14px !important;
        font-size: 0.78rem !important;
        text-transform: uppercase !important;
        letter-spacing: 0.05em !important;
        border-bottom: 1px solid #1e2533 !important;
    }

    /* ── List Table — Compact No-Scroll ────────────── */
    #changelist {
        overflow-x: auto !important;
    }

    #result_list {
        background: #1a1f2e !important;
        border-radius: 10px !important;
        overflow: hidden !important;
        border: 1px solid #1e2533 !important;
        box-shadow: 0 4px 24px rgba(0,0,0,0.3) !important;
        width: 100% !important;
        table-layout: fixed !important;
        font-size: 0.72rem !important;
    }

    #result_list thead th {
        background: linear-gradient(90deg, #0d4f5c, #1a7a8c) !important;
        color: #e2e8f0 !important;
        padding: 7px 8px !important;
        font-size: 0.7rem !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.05em !important;
        border: none !important;
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
    }

    #result_list thead th a,
    #result_list thead th.sorted a {
        color: #fff !important;
        font-size: 0.7rem !important;
    }

    #result_list thead th.sorted {
        background: #0a3f4a !important;
    }

    /* Checkbox column — narrow */
    #result_list thead th:first-child,
    #result_list tbody td:first-child {
        width: 28px !important;
        padding: 5px 6px !important;
    }

    #result_list tbody tr {
        border-bottom: 1px solid #1e2533 !important;
        transition: background 0.15s ease !important;
    }

    #result_list tbody tr:hover {
        background: #1e2d3d !important;
    }

    #result_list tbody tr:nth-child(even) {
        background: #161b27 !important;
    }

    #result_list tbody tr:nth-child(even):hover {
        background: #1e2d3d !important;
    }

    #result_list td {
        padding: 5px 8px !important;
        font-size: 0.72rem !important;
        color: #cbd5e1 !important;
        border: none !important;
        vertical-align: middle !important;
    }

    #result_list td a {
        color: #38bdf8 !important;
        font-weight: 500 !important;
        text-decoration: none !important;
        transition: color 0.2s !important;
    }

    #result_list td a:hover {
        color: #7dd3e8 !important;
    }

    /* ── Action Bar ─────────────────────────────────── */
    .actions {
        background: #161b27 !important;
        border: 1px solid #1e2533 !important;
        border-radius: 8px !important;
        padding: 10px 16px !important;
        margin-bottom: 12px !important;
        display: flex !important;
        align-items: center !important;
        gap: 10px !important;
    }

    .actions select,
    .actions input[type="submit"] {
        background: #0d1117 !important;
        border: 1px solid #2d3748 !important;
        color: #e2e8f0 !important;
        border-radius: 6px !important;
        padding: 5px 10px !important;
        font-size: 0.82rem !important;
    }

    .actions input[type="submit"]:hover {
        background: #1a7a8c !important;
        border-color: #1a7a8c !important;
        cursor: pointer !important;
    }

    /* ── Search Bar ─────────────────────────────────── */
    #toolbar {
        background: #161b27 !important;
        border: 1px solid #1e2533 !important;
        border-radius: 8px !important;
        padding: 10px 16px !important;
        margin-bottom: 12px !important;
    }

    #searchbar {
        background: #0d1117 !important;
        border: 1px solid #2d3748 !important;
        border-radius: 6px !important;
        color: #e2e8f0 !important;
        padding: 6px 12px !important;
        font-size: 0.85rem !important;
        width: 280px !important;
        transition: border-color 0.2s !important;
    }

    #searchbar:focus {
        outline: none !important;
        border-color: #1a7a8c !important;
        box-shadow: 0 0 0 3px rgba(26, 122, 140, 0.2) !important;
    }

    #toolbar input[type="submit"] {
        background: linear-gradient(135deg, #0d4f5c, #1a7a8c) !important;
        color: #fff !important;
        border: none !important;
        border-radius: 6px !important;
        padding: 6px 16px !important;
        cursor: pointer !important;
        font-size: 0.82rem !important;
        font-weight: 600 !important;
        transition: opacity 0.2s !important;
    }

    #toolbar input[type="submit"]:hover {
        opacity: 0.85 !important;
    }

    /* ── Filters Sidebar ────────────────────────────── */
    #changelist-filter {
        background: #1a1f2e !important;
        border: 1px solid #1e2533 !important;
        border-radius: 10px !important;
        overflow: hidden !important;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3) !important;
    }

    #changelist-filter h2 {
        background: linear-gradient(90deg, #0d4f5c, #1a7a8c) !important;
        color: #fff !important;
        padding: 10px 16px !important;
        font-size: 0.78rem !important;
        font-weight: 700 !important;
        letter-spacing: 1px !important;
        text-transform: uppercase !important;
        margin: 0 !important;
    }

    #changelist-filter h3 {
        color: #94a3b8 !important;
        font-size: 0.75rem !important;
        text-transform: uppercase !important;
        letter-spacing: 0.08em !important;
        padding: 10px 16px 4px !important;
        margin: 0 !important;
    }

    #changelist-filter li {
        padding: 3px 16px !important;
    }

    #changelist-filter a {
        color: #64748b !important;
        font-size: 0.83rem !important;
        text-decoration: none !important;
        transition: color 0.2s !important;
    }

    #changelist-filter a:hover,
    #changelist-filter li.selected a {
        color: #38bdf8 !important;
    }

    /* ── Buttons ────────────────────────────────────── */
    .button,
    input[type=submit],
    input[type=button],
    .submit-row input,
    a.button {
        background: linear-gradient(135deg, #0d4f5c, #1a7a8c) !important;
        color: #fff !important;
        border: none !important;
        border-radius: 6px !important;
        padding: 8px 18px !important;
        font-size: 0.83rem !important;
        font-weight: 600 !important;
        cursor: pointer !important;
        transition: opacity 0.2s, transform 0.15s !important;
        text-decoration: none !important;
    }

    .button:hover,
    input[type=submit]:hover {
        opacity: 0.85 !important;
        transform: translateY(-1px) !important;
    }

    .deletelink,
    .button.default {
        background: #7f1d1d !important;
    }

    /* ── Add/Change Links ───────────────────────────── */
    .addlink {
        color: #4ade80 !important;
        font-weight: 600 !important;
        text-decoration: none !important;
        font-size: 0.82rem !important;
        transition: color 0.2s !important;
    }

    .addlink:hover {
        color: #86efac !important;
    }

    .changelink {
        color: #38bdf8 !important;
        font-weight: 600 !important;
        text-decoration: none !important;
        font-size: 0.82rem !important;
        transition: color 0.2s !important;
    }

    .changelink:hover {
        color: #7dd3e8 !important;
    }

    /* ── Fieldsets / Detail View ────────────────────── */
    fieldset {
        background: #1a1f2e !important;
        border: 1px solid #1e2533 !important;
        border-radius: 10px !important;
        margin-bottom: 1.2rem !important;
        padding: 0 !important;
        overflow: hidden !important;
    }

    fieldset h2 {
        background: linear-gradient(90deg, #0d4f5c, #1a7a8c) !important;
        color: #fff !important;
        padding: 10px 20px !important;
        font-size: 0.82rem !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
        letter-spacing: 1px !important;
        margin: 0 !important;
    }

    .form-row {
        border-bottom: 1px solid #1e2533 !important;
        padding: 10px 20px !important;
    }

    .form-row:last-child {
        border-bottom: none !important;
    }

    label {
        color: #94a3b8 !important;
        font-size: 0.82rem !important;
        font-weight: 600 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.04em !important;
    }

    .readonly {
        color: #e2e8f0 !important;
        font-size: 0.9rem !important;
    }

    input[type=text],
    input[type=email],
    input[type=password],
    input[type=number],
    select,
    textarea {
        background: #0d1117 !important;
        border: 1px solid #2d3748 !important;
        border-radius: 6px !important;
        color: #e2e8f0 !important;
        padding: 7px 12px !important;
        font-size: 0.85rem !important;
        transition: border-color 0.2s !important;
    }

    input:focus,
    select:focus,
    textarea:focus {
        outline: none !important;
        border-color: #1a7a8c !important;
        box-shadow: 0 0 0 3px rgba(26, 122, 140, 0.2) !important;
    }

    /* ── Pagination ─────────────────────────────────── */
    .paginator {
        color: #94a3b8 !important;
        font-size: 0.82rem !important;
        padding: 12px 0 !important;
    }

    .paginator a {
        background: #1a1f2e !important;
        border: 1px solid #1e2533 !important;
        color: #38bdf8 !important;
        border-radius: 5px !important;
        padding: 4px 10px !important;
        margin: 0 2px !important;
        text-decoration: none !important;
        transition: background 0.2s !important;
    }

    .paginator a:hover {
        background: #1a7a8c !important;
        color: #fff !important;
    }

    /* ── Messages / Alerts ──────────────────────────── */
    ul.messagelist li {
        background: #064e3b !important;
        color: #6ee7b7 !important;
        border: 1px solid #065f46 !important;
        border-radius: 6px !important;
        padding: 10px 16px !important;
        margin-bottom: 8px !important;
        font-size: 0.85rem !important;
    }

    ul.messagelist li.error {
        background: #7f1d1d !important;
        color: #fca5a5 !important;
        border-color: #991b1b !important;
    }

    ul.messagelist li.warning {
        background: #78350f !important;
        color: #fcd34d !important;
        border-color: #92400e !important;
    }

    /* ── Checkboxes ─────────────────────────────────── */
    input[type="checkbox"] {
        accent-color: #1a7a8c !important;
        width: 15px !important;
        height: 15px !important;
    }

    /* ── Object count line ──────────────────────────── */
    .paginator .this-page {
        background: linear-gradient(135deg, #0d4f5c, #1a7a8c) !important;
        color: #fff !important;
        border-radius: 5px !important;
        padding: 4px 10px !important;
    }

    /* ── Submit Row ─────────────────────────────────── */
    .submit-row {
        background: #161b27 !important;
        border: 1px solid #1e2533 !important;
        border-radius: 8px !important;
        padding: 12px 20px !important;
        margin-top: 16px !important;
    }

    /* ── Scrollbar ──────────────────────────────────── */
    ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }

    ::-webkit-scrollbar-track {
        background: #0d1117;
    }

    ::-webkit-scrollbar-thumb {
        background: #1a7a8c;
        border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: #0d4f5c;
    }

    /* ── Responsive ─────────────────────────────────── */
    @media (max-width: 767px) {
        #header {
            padding: 0 12px !important;
        }

        #result_list td,
        #result_list th {
            padding: 8px 10px !important;
            font-size: 0.78rem !important;
        }
    }
</style>
{% endblock %}
